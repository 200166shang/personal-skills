[project]
name = "agent-yt-dlp-download"
version = "0.1.0"
description = "Stable Agent-facing wrapper around official yt-dlp"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]==2026.8.19",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_dlp_download"]

[project.scripts]
yt-dlp-download = "yt_dlp_download.cli:main"

